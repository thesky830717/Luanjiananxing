<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">

  <body data-page="chapter-1" data-root="..">
    <div class="site-shell">
      <header class="site-header" data-site-header></header>

          <p class="scroll-title">銮驾南行·盛世序幕</p>

        <figure class="painting-frame" data-chapter-interaction>

            <button class="character-dim" type="button" data-empty-close aria-label="关闭当前文字" hidden></button>
            <section class="character-panel" data-character-panel role="dialog" aria-modal="true" aria-label="人物独白" tabindex="-1" hidden>
              <div data-character-copy></div>
            </section>
            <p class="archive-unlock-notice" data-unlock-notice role="status" hidden>仪仗档案已开启</p>
            <button class="chapter-continue" type="button" data-chapter-continue hidden>进入第二章</button>
          </div>

        <aside class="mounting-panel mounting-panel--right" aria-hidden="true"></aside>
      </main>
